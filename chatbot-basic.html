<!doctype html>
<html>
  <head>
    <title>React Basics</title>
  </head>
  <style>
    .send-button {
      padding: 0.8rem;
      font-size: 1rem;
      border-radius: 1rem;
      border: 0.1rem solid green;
      background-color: lightgreen;
      margin-left: 1rem;
    }

    .input-box {
      padding: 0.8rem;
      font-size: 1rem;
      border-radius: 1rem;
      border: 0.1rem solid green;
      flex-grow: 1;
    }

    .app-container {
      max-width: 600px;
      width: 100%;
      margin: auto;
      height: 95vh;
      display: flex;
      flex-direction: column-reverse;
    }

    .robot-message,
    .user-message {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .user-message {
      justify-content: end;
    }

    .input-container {
      display: flex;
    }

    .chat-message {
      background-color: #e8e6e6f1;
      width: fit-content;
      padding: 1rem;
      border-radius: 0.5rem;
      max-width: 250px;
    }

    .chat-message-container {
      flex-grow: 1;
      overflow: scroll;
      scrollbar-width: none;
    }
  </style>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
      function ChatInput(props) {
        const [message, setMessage] = React.useState("");

        function saveInputText(event) {
          setMessage(event.target.value);
        }

        function sendMessage(event) {
          if (
            event.type == "click" ||
            (event.type == "keydown" && event.key == "Enter")
          ) {
            const botResponse = Chatbot.getResponse(message);

            props.setChatMessages([
              ...props.chatMessages,
              {
                message: message,
                sender: "user",
                id: crypto.randomUUID(),
              },
              {
                message: botResponse,
                sender: "robot",
                id: crypto.randomUUID(),
              },
            ]);
            setMessage("");
          }
        }

        return (
          <div className="input-container">
            <input
              type="text"
              placeholder="Chat with the bot.."
              onChange={saveInputText}
              onKeyDown={sendMessage}
              value={message}
              className="input-box"
            ></input>
            <button onClick={sendMessage} className="send-button">
              Send
            </button>
          </div>
        );
      }

      function ChatMessage(props) {
        const message = props.message;
        const sender = props.sender;

        return (
          <div className={sender == "robot" ? "robot-message" : "user-message"}>
            {sender == "robot" && (
              <img
                src="./images/robot.png"
                alt="robot image"
                width="50"
                className="profile-img"
              />
            )}
            <p className="chat-message">{message}</p>
            {sender == "user" && (
              <img
                src="./images/user.png"
                alt="user image"
                width="50"
                className="profile-img"
              />
            )}
          </div>
        );
      }

      function ChatMessages(props) {
        const chatMessageRef = React.useRef(null);

        React.useEffect(() => {
          const containerElement = chatMessageRef.current;
          containerElement.scrollTop = containerElement.scrollHeight;
        }, [props.chatMessages]);

        return (
          <div className="chat-message-container" ref={chatMessageRef}>
            {props.chatMessages.map((c) => {
              return (
                <ChatMessage message={c.message} sender={c.sender} key={c.id} />
              );
            })}
          </div>
        );
      }

      function App() {
        const [chatMessages, setChatMessages] = React.useState([
          {
            message: "Hello",
            sender: "user",
            id: crypto.randomUUID(),
          },
          {
            message: "Hello, how can i  help you ? ",
            sender: "robot",
            id: crypto.randomUUID(),
          },
        ]);

        return (
          <div className="app-container">
            <ChatInput
              chatMessages={chatMessages}
              setChatMessages={setChatMessages}
            />
            <ChatMessages chatMessages={chatMessages} />
          </div>
        );
      }
      const container = document.querySelector(".js-container");
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
